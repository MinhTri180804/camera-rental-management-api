name: clean-architecture-dev-environment
services:
  mongodb:
    container_name: mongodb-service-container
    image: mongo:7
    restart: unless-stopped
    command:
      ['--replSet', 'rs0', '--bind_ip_all', '--keyFile', '/etc/mongo-keyfile']
    ports:
      - '${MONGODB_PORT:-27017}:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:-root}
    volumes:
      - mongodb_data:/data/db
      - ./mongo-keyfile/mongo-keyfile:/etc/mongo-keyfile:ro
    networks:
      - backend
    healthcheck:
      test: |
        mongosh --port 27017 --quiet --eval "db.adminCommand('ping')"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  mongo-init:
    image: mongo:7
    container_name: mongo-init-container
    depends_on:
      mongodb:
        condition: service_healthy
    restart: 'no'
    networks:
      - backend
    entrypoint: >
      mongosh --host mongodb:27017 -u ${MONGODB_USERNAME:-root} -p ${MONGODB_PASSWORD:-root} --authenticationDatabase admin --eval '
        try {
          rs.status();
          print("Replica set already initialized");
        } catch (err) {
          rs.initiate({
            _id: "rs0",
            members: [{ _id: 0, host: "localhost:27017" }]
          });
          print("Replica set initiated");
        }
      '

  redis:
    container_name: redis-service-container
    image: redis:7
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    networks:
      - backend

  redis-commander:
    container_name: redis-commander-container
    image: rediscommander/redis-commander:latest
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - '8088:8081'
    depends_on:
      - redis
    networks:
      - backend

volumes:
  mongodb_data:
  redis_data:

networks:
  backend:
    driver: bridge

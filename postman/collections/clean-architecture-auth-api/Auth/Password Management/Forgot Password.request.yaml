$kind: http-request
name: Forgot Password
method: POST
url: '{{baseUrl}}/auth/forgot-password'
order: 1000
description: "Sends an OTP to the user's email to initiate the forgot password flow."
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "user@example.com"
    }

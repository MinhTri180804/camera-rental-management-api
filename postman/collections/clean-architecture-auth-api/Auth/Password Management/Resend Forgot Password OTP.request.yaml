$kind: http-request
name: Resend Forgot Password OTP
method: POST
url: "{{baseUrl}}/auth/forgot-password/resend"
order: 2000
description: Resends the forgot password OTP if the previous one expired or was
  not received.
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "user@example.com"
    }

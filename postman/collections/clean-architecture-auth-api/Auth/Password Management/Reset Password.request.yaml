$kind: http-request
name: Reset Password
method: POST
url: "{{baseUrl}}/auth/forgot-password/reset-password"
order: 3000
description: Resets the user's password using the OTP received via email.
  Password must be at least 8 characters with uppercase, lowercase, number, and
  special character. OTP must be 6 digits.
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "user@example.com",
      "otp": "134583",
      "password": "NewPassword@123"
    }

$kind: http-request
method: POST
url: "{{baseUrl}}/auth/login"
scripts:
  - type: afterResponse
    code: |-
      const token = pm.response.json().data.accessToken; 
      pm.collectionVariables.set('accessToken', token);
    language: text/javascript
examples: .resources/Login.resources/examples
order: 1000
description: Authenticates a user and returns accessToken and refreshToken.
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "te@example.com",
      "password": "Password@123"
    }
